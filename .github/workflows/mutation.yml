name: Mutation

# Two sweeps, recorded in docs/adr/0009-mutation-testing.md.
#
# The core sweep mutates the pure modules and holds them to the unit suite. It
# runs on every push to main, and its `break` in stryker.core.config.mjs is the gate.
#
# The full sweep mutates everything, the CLI and the engine included, against
# the whole suite. Its tests spawn git and write to disk, so it is the slower,
# by an order of magnitude on a Windows workstation; it runs weekly and on
# request, and its `break` in stryker.config.mjs is set from the first hosted
# run (ADR-0009).
#
# Both run a mutant's test files the quickest first (vitest.mutation.config.ts;
# ADR-0009, amended 2026-10-11).
#
# A score is of the mutants a sweep made, and Stryker makes none of what stands
# under a TypeScript `as`. After each sweep its report is read for such places
# (scripts/mutation-unmeasured.mjs), and one that is not recorded there fails
# the job (ADR-0009, amended 2026-10-12).
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: Run the full sweep as well
        type: boolean
        default: false

concurrency:
  group: mutation-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    # The image the hosted sweeps in ADR-0009 were measured on. Another image
    # is another measurement: spec-core's ADR-0008 says what moving takes.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      # No dependency's install script runs: the tree needs none, npm 12 runs
      # none unless package.json allows the package, and the flag has npm 10 and
      # 11 run none either (tests/npm.test.ts).
      - run: npm ci --ignore-scripts

      - name: Core mutation sweep
        run: npm run test:mutation

      # Where the sweep failed its own gate too: the report is what it read.
      - name: Count what stood under an as, which no mutant is made of
        if: ${{ !cancelled() }}
        run: node scripts/mutation-unmeasured.mjs reports/mutation-core/mutation.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-core
          path: reports/mutation-core/
          if-no-files-found: ignore

  full:
    if: github.event_name == 'schedule' || inputs.full
    runs-on: ubuntu-24.04
    # Headroom for a bad runner, not a budget: the hosted full sweeps took 18 to
    # 28 minutes in vitest's order of test files, and 13 and 21 with the quickest
    # first (ADR-0009, amended 2026-10-11), on runners whose first run of the
    # suite took from 10 to 15 seconds. A sweep that keeps passing 45 wants
    # shards, not this number raising.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Full mutation sweep
        run: npm run test:mutation:full

      # Where the sweep failed its own gate too: the report is what it read.
      - name: Count what stood under an as, which no mutant is made of
        if: ${{ !cancelled() }}
        run: node scripts/mutation-unmeasured.mjs reports/mutation/mutation.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-full
          path: reports/mutation/
          if-no-files-found: ignore
