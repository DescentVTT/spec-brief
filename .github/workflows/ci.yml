name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the whole matrix again on the commit it publishes.
  workflow_call:

# Called by the release, `github.workflow` is the caller's name, so its CI has a
# group of its own: a push to main cannot cancel a release rehearsal's CI
# halfway, and a rehearsal cannot cancel main's. A pull request's runs, and
# main's, still replace their own older ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Headroom for a bad runner, not a budget: the slowest leg, Windows, took
    # about a minute. A job that hangs stops here rather than at GitHub's six
    # hours, and so does the release, which runs this matrix.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor package.json promises, 24 the active LTS, 26 the
        # current release: a break there is news before it is an incident.
        # Each image by the label that is its alone, never `-latest`, which
        # GitHub moves (tests/runner-images.test.ts). Windows and macOS are what
        # their `-latest` gave on 2026-10-07. Both Ubuntu images, because
        # `ubuntu-latest` hands a user's job either from 2026-10-19 and the
        # suite runs the image's git and bash. spec-core's ADR-0008 has the
        # steps that move one.
        os: [ubuntu-24.04, ubuntu-26.04, windows-2025-vs2026, macos-26]
        node: ['22', '24', '26']

    steps:
      # Actions are pinned to a commit, with the tag beside it, because a tag
      # can be moved and a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # No dependency's install script runs: the tree needs none, npm 12 runs
      # none unless package.json allows the package, and the flag has npm 10 and
      # 11 run none either (tests/npm.test.ts).
      - run: npm ci --ignore-scripts

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # spec-brief lints the briefs this repository keeps for its own next rounds.
      - name: Check this repository's own briefs
        run: npm run selfcheck

  # On the image the floors were measured on, as the sweeps and the release
  # stay on theirs: moving one is spec-core's ADR-0008.
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Test with coverage
        run: npm run test:coverage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
