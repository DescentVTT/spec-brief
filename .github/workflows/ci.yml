name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the whole matrix again on the commit it publishes.
  workflow_call:

# Called by the release, `github.workflow` is the caller's name, so its CI has a
# group of its own: a push to main cannot cancel a release rehearsal's CI
# halfway, and a rehearsal cannot cancel main's. A pull request's runs, and
# main's, still replace their own older ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor package.json promises, 24 the active LTS, 26 the
        # current release: a break there is news before it is an incident.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24', '26']

    steps:
      # Actions are pinned to a commit, with the tag beside it, because a tag
      # can be moved and a commit cannot.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # spec-brief lints the briefs this repository keeps for its own next rounds.
      - name: Check this repository's own briefs
        run: npm run selfcheck

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
