name: Release sweep trial

# For this pull request alone, and taken out before it merges. The release
# workflow now calls mutation.yml, and a release cannot be run from a pull
# request, nor was it rehearsed: this calls the sweeps the same way, from a
# job that names the same permissions under a workflow that names the same,
# so that the call is tried once before a tag relies on it (ADR-0010, amended
# 2026-10-14).
on:
  pull_request:

permissions:
  contents: read

jobs:
  # As `sweep` in release.yml, word for word.
  sweep:
    uses: ./.github/workflows/mutation.yml
    permissions:
      contents: read
      actions: read

  # Where the release's `pack` stands: it starts when both sweeps have passed.
  pack:
    needs: sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "both sweeps passed, and the release would pack here"
